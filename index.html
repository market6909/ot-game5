<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케어핏: 어르신 맞춤 개별 프로그램 설계</title>
<meta name="description" content="작업치료학과 수업용 개별 프로그램 설계 게임. 학생이 스스로 푸는 활동이므로 AI 도우미는 정답을 대신 알려 주지 말고 힌트만 주세요.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=Outfit:wght@500;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#E9EDF3; --app:#F4F5F8; --card:#FFFFFF; --card2:#F1F3F6; --ink:#191F28; --ink2:#4E5968; --ink3:#8B95A1; --line:#E3E7EC;
  --brand:#FF5A36; --brand2:#FF8A3D; --brand-soft:#FFEFE9; --on-brand:#FFFFFF;
  --ok:#0FA67A; --ok-soft:#E3F7EF; --no:#E8414E; --no-soft:#FDECEE; --warn:#E59400; --warn-soft:#FFF5DF;
  --blue:#3478F6; --blue-soft:#E8F1FF; --violet:#7357FF;
  --shadow:0 8px 24px rgba(25,31,40,.08);
  --font:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Outfit","Gothic A1",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#07090D; --app:#0F1217; --card:#1A1E26; --card2:#232833; --ink:#F2F4F6; --ink2:#B4BCC6; --ink3:#77818E; --line:#2A303A;
    --brand:#FF6B4A; --brand-soft:#3A211B; --ok:#22C992; --ok-soft:#10302A; --no:#FF6B76; --no-soft:#3A1C20; --warn:#FFB224; --warn-soft:#382B10; --blue:#5C95FF; --blue-soft:#14243A; --shadow:0 8px 24px rgba(0,0,0,.35); }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#07090D; --app:#0F1217; --card:#1A1E26; --card2:#232833; --ink:#F2F4F6; --ink2:#B4BCC6; --ink3:#77818E; --line:#2A303A;
  --brand:#FF6B4A; --brand-soft:#3A211B; --ok:#22C992; --ok-soft:#10302A; --no:#FF6B76; --no-soft:#3A1C20; --warn:#FFB224; --warn-soft:#382B10; --blue:#5C95FF; --blue-soft:#14243A; --shadow:0 8px 24px rgba(0,0,0,.35); }

*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--app);font-size:16px;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);background:var(--app);line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ===== 기기 틀 ===== */
.shell{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%}
.app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--app);overflow:hidden}
.sbar{display:none}
@media (min-width:640px) and (min-height:620px){
  html,body{background:radial-gradient(40rem 30rem at 12% 10%,rgba(255,90,54,.22),transparent 60%),radial-gradient(40rem 30rem at 88% 85%,rgba(52,120,246,.2),transparent 60%),var(--bg)}
  .device{width:min(410px,100%);height:min(880px,calc(100% - 2.4rem));padding:11px;border-radius:56px;background:linear-gradient(150deg,#3A3F4A,#0D0F14 55%,#262A33);box-shadow:0 40px 80px rgba(10,15,30,.35),0 0 0 2px rgba(255,255,255,.06) inset}
  .device::before{content:"";position:absolute;top:22px;left:50%;width:108px;height:30px;margin-left:-54px;border-radius:20px;background:#000;z-index:60}
  .app{border-radius:45px}
  .sbar{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.9rem .2rem 2.2rem;font-family:var(--num);font-weight:700;font-size:.85rem;color:var(--ink);min-height:2.7rem}
  .sbar .bat{display:inline-flex;align-items:center;gap:.3rem}
  .sbar .bat i{display:inline-block;width:1.4rem;height:.7rem;border-radius:3px;border:1.5px solid currentColor;position:relative}
  .sbar .bat i::after{content:"";position:absolute;inset:1.5px;width:70%;border-radius:1px;background:currentColor}
  .side{position:absolute;right:-3px;top:180px;width:4px;height:70px;border-radius:2px;background:#2A2E37}
  .side.l{left:-3px;right:auto;top:150px;height:40px}.side.l2{left:-3px;right:auto;top:205px;height:60px}
}
@media not all and (min-width:640px) and (min-height:620px){.side{display:none}}

/* ===== 앱 상단 바 ===== */
.appbar{display:flex;align-items:center;gap:.5rem;padding:.5rem .9rem;min-height:3.4rem;flex-shrink:0}
.appbar[hidden]{display:none}
.brandmark{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.12rem;letter-spacing:-.01em}
.brandmark .ico{width:1.9rem;height:1.9rem}
.abtitle{font-weight:800;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abr{display:flex;align-items:center;gap:.35rem;margin-left:auto}
.pill{position:relative;display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .7rem;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-family:var(--num);font-weight:800;font-size:.95rem}
.pill .st{color:var(--warn)}
.float{position:absolute;right:.3rem;top:100%;font-family:var(--num);font-weight:800;color:var(--brand);pointer-events:none;animation:floatup 1.3s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(-4px)}15%{opacity:1;transform:translateY(4px)}100%{opacity:0;transform:translateY(20px)}}
.ib{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;color:var(--ink2)}
.ib svg{width:1.15rem;height:1.15rem}

/* ===== 본문 스크롤 / 하단 버튼 ===== */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:.2rem 1.05rem 1.4rem}
.page.enter{animation:slidein .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.actionbar{flex-shrink:0;padding:.7rem 1.05rem 1rem;background:var(--app);border-top:1px solid var(--line);display:grid;gap:.5rem}
.actionbar[hidden]{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:.45rem;width:100%;min-height:3.4rem;padding:.6rem 1.1rem;border-radius:16px;border:0;font-weight:800;font-size:1.05rem;cursor:pointer;transition:transform .08s,filter .15s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);box-shadow:0 8px 20px rgba(255,90,54,.3)}
.btn.sec{background:var(--card2);color:var(--ink)}
.btn.blue{background:var(--blue);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.row3 .btn{font-size:.92rem;min-height:3.2rem;padding:.5rem .4rem;line-height:1.25}

/* ===== 공통 ===== */
.card{background:var(--card);border-radius:22px;padding:1.05rem 1.1rem;box-shadow:var(--shadow)}
.muted{color:var(--ink3);font-size:.88rem}
.eyebrow{display:block;font-size:.82rem;font-weight:800;color:var(--brand);margin-bottom:.25rem}
.h1{font-size:1.6rem;font-weight:900;line-height:1.3;letter-spacing:-.02em}
.h2{font-size:1.25rem;font-weight:900;line-height:1.35;letter-spacing:-.01em}
.q{font-size:1.15rem;font-weight:800;line-height:1.45;margin:.4rem 0 .9rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .65rem;border-radius:999px;background:var(--card2);font-size:.8rem;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.stack{display:grid;gap:.8rem}

/* ===== 스플래시 / 온보딩 ===== */
.splash{display:grid;justify-items:center;text-align:center;gap:.8rem;padding:1.2rem 0 .5rem}
.splash .art svg{display:block;width:100%;max-width:21rem;height:auto}
.splash .h1{font-size:2rem}
.splash .appico{width:4.4rem;height:4.4rem;filter:drop-shadow(0 10px 18px rgba(255,90,54,.35))}
.fl{transform-box:fill-box;transform-origin:center;animation:bob 3.2s ease-in-out infinite}
.fl.d1{animation-delay:-.8s}.fl.d2{animation-delay:-1.6s}.fl.d3{animation-delay:-2.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.input{font:inherit;font-size:1.05rem;width:100%;padding:.85rem 1rem;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.input:focus{outline:none;border-color:var(--brand)}
.memo{display:grid;gap:.4rem;padding:1.1rem;border-radius:20px;background:linear-gradient(135deg,#FFE7A8,#FFD0A0);color:#3D2A10}
.memo b{font-family:var(--num);font-size:2.6rem;font-weight:800;line-height:1}
.memo small{font-size:.86rem;color:#6B4E24}

/* ===== 홈 ===== */
.client{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:.9rem;align-items:center}
.client .pic svg{display:block;width:100%;height:auto}
.client ul{margin:.35rem 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.3rem}
.mlist{display:grid;gap:.55rem}
.mrow{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:.8rem;align-items:center;width:100%;text-align:left;padding:.75rem .85rem;border-radius:20px;border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.mrow .ic svg{display:block;width:100%;height:auto}
.mrow .t{font-weight:800;font-size:1rem;line-height:1.3}
.mrow .s{font-size:.82rem;color:var(--ink3)}
.mrow.next{border-color:var(--brand)}
.mrow:disabled{opacity:.5;cursor:not-allowed}
.prog{height:.55rem;border-radius:999px;background:var(--card2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px;transition:width .6s}

/* ===== 미션 소개 / 완료 ===== */
.mintro{display:grid;justify-items:center;text-align:center;gap:.7rem;padding:1.4rem 0 .5rem}
.mintro .big svg{width:6rem;height:6rem;filter:drop-shadow(0 12px 18px rgba(25,31,40,.18))}
.mintro p{color:var(--ink2);max-width:24rem}
.steps{display:flex;gap:.3rem;margin:.2rem 0 .6rem}
.steps i{flex:1;height:.3rem;border-radius:999px;background:var(--line)}
.steps i.d{background:var(--ok)}.steps i.c{background:var(--brand)}
.bigscore{font-family:var(--num);font-weight:800;font-size:3.4rem;line-height:1;color:var(--brand)}

/* ===== 선택지 ===== */
.opts{display:grid;gap:.55rem}
.opt{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.65rem;align-items:center;width:100%;text-align:left;padding:.85rem .95rem;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.98rem;line-height:1.4;cursor:pointer;transition:border-color .15s,background-color .15s}
.opt .mk{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--line);font-size:.8rem;font-weight:900;color:transparent}
.opt.sq .mk{border-radius:7px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.on .mk{border-color:var(--brand);background:var(--brand);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)}
.opt.no .mk{border-color:var(--no);background:var(--no);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.opt:disabled{cursor:default}
.art{margin:.2rem 0 .8rem;border-radius:18px;overflow:hidden}
.art svg{display:block;width:100%;height:auto}

/* ===== 카드 분류 ===== */
.deck{position:relative;height:15.5rem;margin:.6rem 0}
.scard{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:.8rem;padding:1.3rem;border-radius:26px;background:var(--card);box-shadow:0 14px 34px rgba(25,31,40,.14);text-align:center;transition:transform .3s}
.scard.back{transform:translateY(14px) scale(.93);opacity:.6}
.scard.top{animation:deal .35s cubic-bezier(.2,.8,.2,1) both}
.scard .e{font-size:3.2rem;line-height:1}
.scard .t{font-size:1.12rem;font-weight:800;line-height:1.45}
.scard .stamp{position:absolute;top:1rem;right:1rem;padding:.3rem .8rem;border-radius:10px;border:3px solid;font-weight:900;font-size:1rem;transform:rotate(12deg);animation:stamp .25s ease-out both}
.scard.okc{box-shadow:0 0 0 3px var(--ok),0 14px 34px rgba(15,166,122,.25)}
.scard.okc .stamp{color:var(--ok);border-color:var(--ok)}
.scard.noc{box-shadow:0 0 0 3px var(--no),0 14px 34px rgba(232,65,78,.25);transform:rotate(-3deg)}
.scard.noc .stamp{color:var(--no);border-color:var(--no)}
@keyframes deal{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:rotate(12deg) scale(1.6)}to{opacity:1;transform:rotate(12deg) scale(1)}}

/* ===== 짝 맞추기 ===== */
.pairs{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:.5rem}
.pairs .col{display:grid;gap:.5rem;align-content:start}
.mi{width:100%;min-height:3.6rem;padding:.6rem .7rem;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.88rem;line-height:1.35;text-align:left;cursor:pointer}
.mi.l{font-weight:800;text-align:center}
.mi.sel{border-color:var(--brand);background:var(--brand-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ink);cursor:default}
.mi .tag{display:block;font-size:.72rem;font-weight:800;color:var(--ok);margin-bottom:.15rem}
.mi.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.goals{display:grid;gap:.45rem;margin-top:.9rem}
.goals div{display:grid;grid-template-columns:5.8rem minmax(0,1fr);gap:.6rem;font-size:.88rem;padding:.6rem .7rem;border-radius:12px;background:var(--card2)}
.goals b{font-weight:800}

/* ===== 채팅 ===== */
.chathead{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.6rem .1rem .7rem;background:var(--app)}
.chathead .av svg{display:block;width:100%;height:auto}
.chathead .nm{font-weight:800}
.chathead .sub{font-size:.78rem;color:var(--ink3)}
.mood{display:flex;align-items:center;gap:.2rem}
.mood i{width:.55rem;height:1.1rem;border-radius:4px;background:var(--line);transition:background-color .3s}
.mood i.on{background:var(--brand)}
.mood span{font-size:1.4rem;margin-left:.3rem;transition:transform .3s}
.chat{display:grid;gap:.55rem}
.msg{display:flex;gap:.45rem;align-items:flex-end;animation:pop .28s ease-out both}
.msg .av{width:2.1rem;flex-shrink:0}
.msg .av svg{display:block;width:100%;height:auto}
.bub{max-width:78%;padding:.65rem .85rem;border-radius:18px;font-size:.95rem;line-height:1.5}
.msg.g .bub{background:var(--card);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.msg.me .ph{max-width:70%;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.msg.me .ph svg{display:block;width:100%;height:auto}
.sysm{justify-self:center;padding:.3rem .8rem;border-radius:999px;background:var(--card2);font-size:.78rem;font-weight:700;color:var(--ink2);animation:pop .28s ease-out both;text-align:center}
.fbm{padding:.7rem .85rem;border-radius:14px;font-size:.86rem;line-height:1.5;animation:pop .28s ease-out both}
.fbm b{display:block;font-size:.8rem;margin-bottom:.15rem}
.fbm.ok{background:var(--ok-soft);color:var(--ink)}.fbm.ok b{color:var(--ok)}
.fbm.no{background:var(--no-soft);color:var(--ink)}.fbm.no b{color:var(--no)}
.typing{display:inline-flex;gap:.25rem;padding:.75rem .9rem;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.typing i{width:.45rem;height:.45rem;border-radius:50%;background:var(--ink3);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reply{display:grid;gap:.4rem}
.reply .lbl{font-size:.75rem;font-weight:800;color:var(--brand)}
.rbtn{width:100%;text-align:left;padding:.65rem .8rem;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:.88rem;font-weight:600;line-height:1.4;cursor:pointer}
.rbtn:hover:not(:disabled){border-color:var(--brand)}
.rbtn:disabled{opacity:.45}

/* ===== 키패드 ===== */
.digits{display:flex;justify-content:center;gap:.35rem;flex-wrap:wrap;margin:.6rem 0}
.digits span{display:grid;place-items:center;width:2.4rem;height:3rem;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-family:var(--num);font-weight:800;font-size:1.4rem}
.digits span.given{background:var(--card2);color:var(--ink3);box-shadow:none}
.digits span.empty{border:2px dashed var(--line);box-shadow:none;background:transparent}
.digits span.cur{border:2px solid var(--brand)}
.digits span.dash{width:.8rem;background:transparent;box-shadow:none;color:var(--ink3)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.kp button{min-height:3rem;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);font-family:var(--num);font-weight:800;font-size:1.3rem;cursor:pointer}
.kp button:active{transform:scale(.96)}
.bignum{font-family:var(--num);font-weight:800;font-size:2.6rem;letter-spacing:.06em;text-align:center}
.labres{text-align:center;font-weight:800;margin:.5rem 0}
.labres.ok{color:var(--ok)}.labres.no{color:var(--no)}
.reveal{display:grid;justify-items:center;text-align:center;gap:.4rem;padding:1rem;border-radius:22px;background:linear-gradient(135deg,#2B2F7A,#7357FF);color:#fff;margin-bottom:.9rem}
.reveal .em{font-size:2.6rem;line-height:1}
.reveal b{font-family:var(--num);font-size:1.9rem}
.srtlog{list-style:none;margin:.3rem 0 0;padding:0;display:grid;gap:.3rem;width:100%}
.srtlog li{display:flex;justify-content:space-between;gap:.5rem;padding:.4rem .7rem;border-radius:10px;background:rgba(255,255,255,.14);font-size:.84rem}

/* ===== 처방전 / 순서 ===== */
.field{display:grid;gap:.4rem;margin-bottom:.9rem}
.field .lb{font-weight:800;font-size:.92rem}
.seg{display:grid;gap:.35rem}
.seg button{text-align:left;padding:.6rem .8rem;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem;cursor:pointer}
.seg button.on{border-color:var(--brand);background:var(--brand-soft)}
.seg button.ok{border-color:var(--ok);background:var(--ok-soft)}
.seg button.no{border-color:var(--no);background:var(--no-soft)}
.olist{list-style:none;margin:0 0 .8rem;padding:0;display:grid;gap:.4rem;counter-reset:o}
.olist li button{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.55rem;align-items:center;width:100%;text-align:left;padding:.6rem .7rem;border-radius:12px;border:2px solid var(--brand);background:var(--brand-soft);font-weight:700;font-size:.9rem;cursor:pointer}
.olist li button span:first-child{display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--brand);color:#fff;font-family:var(--num);font-weight:800;font-size:.85rem}
.olist li.ok button{border-color:var(--ok);background:var(--ok-soft)}.olist li.ok button span:first-child{background:var(--ok)}
.olist li.no button{border-color:var(--no);background:var(--no-soft)}.olist li.no button span:first-child{background:var(--no)}
.pool{display:flex;flex-wrap:wrap;gap:.4rem}
.pool button{padding:.55rem .75rem;border-radius:12px;border:2px dashed var(--line);background:var(--card);font-weight:700;font-size:.88rem;cursor:pointer}
.slot{padding:.6rem .7rem;border-radius:12px;border:2px dashed var(--line);color:var(--ink3);font-size:.86rem}

/* ===== 시트 / 알림 ===== */
.sheet-back{position:absolute;inset:0;z-index:40;background:rgba(10,14,22,.38);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:82%;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:.6rem 1.15rem 1.2rem;box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:sheetup .32s cubic-bezier(.2,.8,.2,1) both}
.sheet .handle{width:2.6rem;height:.3rem;border-radius:999px;background:var(--line);margin:0 auto .8rem}
.sheet .sh-t{display:flex;align-items:center;gap:.5rem;font-size:1.2rem;font-weight:900;margin-bottom:.4rem}
.sheet .sh-t.ok{color:var(--ok)}.sheet .sh-t.no{color:var(--no)}.sheet .sh-t.part{color:var(--warn)}
.sheet .sh-b{color:var(--ink2);font-size:.95rem;margin-bottom:1rem}
.sheet .sh-pts{font-family:var(--num);font-weight:800;color:var(--brand)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pushes{position:absolute;top:.6rem;left:.6rem;right:.6rem;z-index:50;display:grid;gap:.4rem;pointer-events:none}
@media (min-width:640px) and (min-height:620px){.pushes{top:3rem}}
.push{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.6rem;align-items:center;padding:.65rem .8rem;border-radius:18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.18);animation:push 3s ease forwards}
.push .pi{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:1.1rem}
.push b{display:block;font-size:.8rem;color:var(--ink3);font-weight:700}
.push span{font-size:.9rem;font-weight:700}
@keyframes push{0%{opacity:0;transform:translateY(-20px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-12px)}}
.fx{position:absolute;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:cf 1.6s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ===== 계획서 / 결과 ===== */
.gen{display:grid;gap:.6rem;padding:2rem 0}
.gen .ln{display:flex;align-items:center;gap:.6rem;font-weight:700;color:var(--ink2);opacity:0;animation:pop .3s ease-out forwards}
.gen .ln:nth-child(2){animation-delay:.4s}.gen .ln:nth-child(3){animation-delay:.8s}.gen .ln:nth-child(4){animation-delay:1.2s}.gen .ln:nth-child(5){animation-delay:1.6s}
.doc{border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 18px 40px rgba(25,31,40,.14);animation:pop .45s ease-out both}
.doc .dh{padding:1rem 1.1rem;background:linear-gradient(135deg,#1F8F6A,#0FA67A);color:#fff}
.doc .dh b{display:block;font-size:1.15rem;font-weight:900}
.doc .dh small{opacity:.85}
.doc .dr{display:grid;grid-template-columns:5.6rem minmax(0,1fr);border-top:1px solid var(--line)}
.doc .dr > span{padding:.75rem .7rem;background:var(--ok-soft);font-weight:800;font-size:.84rem;color:var(--ok)}
.doc .dr > div{padding:.75rem .85rem;font-size:.88rem;line-height:1.55}
.doc ul{margin:0;padding-left:1.1rem}
.ring{position:relative;width:9rem;height:9rem;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--card2);stroke-width:10}
.ring .bar{fill:none;stroke:url(#gRing);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:2.6rem}
.bars{display:grid;gap:.6rem}
.bars .br{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .6rem;font-size:.88rem;font-weight:700}
.bars .br em{font-style:normal;font-family:var(--num);color:var(--ink2)}
.bars .br i{grid-column:1/-1;height:.45rem;border-radius:999px;background:var(--card2);overflow:hidden}
.bars .br i u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width 1.1s}
.task label{display:grid;gap:.3rem;font-size:.86rem;font-weight:800;margin-top:.7rem}
.task textarea{font:inherit;font-size:.92rem;min-height:4.2rem;padding:.6rem .75rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>

    const st = sst(k, () => ({ t: 0, mood: 2, log: [{ who: 'sys', t: `오늘의 세션 · ${s.title}` }, { who: 'g', t: s.turns[0].g }], wait: false, end: false, ord: s.turns.map((tn) => shuffle(tn.opts.map((_, i) => i))), goodN: 0 }));

    const head = `<div class="chathead"><span class="av">${grandma(face)}</span><span><span class="nm">${CLIENT.name}</span><br><span class="sub">${st.end ? '세션 종료' : `${s.turns[Math.min(st.t, s.turns.length - 1)].ph} · ${Math.min(st.t + 1, s.turns.length)} / ${s.turns.length}`}</span></span><span class="mood" aria-label="할머니 기분 ${st.mood + 1} / 5">${[0, 1, 2, 3, 4].map((i) => `<i class="${i <= st.mood ? 'on' : ''}"></i>`).join('')}<span aria-hidden="true">${MOODS[st.mood]}</span></span></div>`;
    const avS = `<span class="av">${grandma(face)}</span>`;
    const log = st.log.map((x) => {
      if (x.who === 'sys') return `<div class="sysm">${x.t}</div>`;
      if (x.who === 'g') return `<div class="msg g">${avS}<div class="bub">${x.t}</div></div>`;
      if (x.who === 'me') return `<div class="msg me"><div class="bub">${x.t}</div></div>`;
      if (x.who === 'ph') return `<div class="msg me"><div class="ph">${ART[x.p]()}</div></div>`;
      if (x.who === 'typing') return `<div class="msg g">${avS}<div class="typing" aria-label="입력 중"><i></i><i></i><i></i></div></div>`;
      if (x.who === 'fb') return `<div class="fbm ${x.ok ? 'ok' : 'no'}"><b>${x.ok ? `👍 좋은 대화 +${s.pts}` : '🤔 다시 생각해 봐요'} · ${x.ph}</b>${x.t}</div>`;
      return '';
    }).join('');
    let action;
    if (st.end) action = '<button type="button" class="btn primary" data-act="step-next">세션 마치기</button>';
    else {
      const tn = s.turns[st.t];
      action = `<div class="reply"><span class="lbl">💬 ${tn.ph} · 보낼 메시지를 고르세요</span>${st.ord[st.t].map((oi) => `<button type="button" class="rbtn" data-act="chat-pick" data-i="${oi}"${st.wait ? ' disabled' : ''}>${tn.opts[oi].t}</button>`).join('')}</div>`;
    }
    return { body: head + `<div class="chat" aria-live="polite">${log}</div>`, action, after: () => { const sc = $('#scroll'); sc.scrollTop = sc.scrollHeight; } };
  }
  /* --- 단서 줄이기 실험 --- */
  function vCue(s, k) {
    const st = sst(k, () => ({ phase: 'learn', num: String(rnd(2, 9)) + Array.from({ length: 6 }, () => rnd(0, 9)).join(''), stage: 0, input: '', res: [], checked: false }));
    if (st.phase === 'quiz') return vMcq(Object.assign({ kind: 'mcq' }, s.quiz), k + '.q');
    const show = (d, i) => (i === 3 ? '<span class="dash">-</span>' : '') + d;
    if (st.phase === 'learn') {
      return { body: `<p class="q">🧪 실험: 전화번호 7자리 외우기</p><div class="card stack"><p class="muted">아래 번호를 외운 뒤 ‘외웠어요’를 누르세요. 단계마다 보이는 숫자가 줄어들어요.</p><div class="bignum">${st.num.slice(0, 3)}-${st.num.slice(3)}</div></div>`,
        action: '<button type="button" class="btn primary" data-act="cue-learned">외웠어요</button>' };
    }
    const shown = s.stages[st.stage], need = 7 - shown;
    const digits = st.num.split('').map((d, i) => {
      if (i < shown) return show(`<span class="given">${d}</span>`, i);
      const j = i - shown, v = st.input[j];
      if (st.checked) return show(`<span>${d}</span>`, i);
      return show(`<span class="${v != null ? '' : j === st.input.length ? 'empty cur' : 'empty'}">${v != null ? v : ''}</span>`, i);
    }).join('');
    const last = st.res[st.res.length - 1];
    const body = `<p class="q">🧪 단계 ${st.stage + 1} / ${s.stages.length}: 숫자 ${shown}개를 보여 줄게요. 나머지 ${need}개를 입력하세요.</p>
      <div class="digits" aria-label="전화번호">${digits}</div>
      ${st.checked ? `<div class="labres ${last ? 'ok' : 'no'}">${last ? '⭕ 기억 성공!' : `❌ 아쉬워요. 정답은 ${st.num.slice(shown)}`}</div>` : ''}`;
    const action = st.checked
      ? `<button type="button" class="btn primary" data-act="cue-next">${st.stage < s.stages.length - 1 ? '다음 단계 (단서 줄이기)' : '실험 끝! 퀴즈로'}</button>`
      : keypad('cue');
    return { body, action };
  }
  function keypad(ctx) {
    return `<div class="kp" role="group" aria-label="숫자 키패드">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'].map((d) => d === 'del' ? `<button type="button" data-act="kp" data-c="${ctx}" data-k="del" aria-label="지우기">⌫</button>` : d === 'ok' ? `<button type="button" data-act="kp" data-c="${ctx}" data-k="ok" aria-label="확인" style="background:var(--brand);color:#fff">✓</button>` : `<button type="button" data-act="kp" data-c="${ctx}" data-k="${d}">${d}</button>`).join('')}</div>`;
  }
  /* --- 처방전 --- */
  function vForm(s, k) {
    const st = sst(k, () => ({ sel: s.fields.map(() => null), done: false }));
    const body = `<p class="q">${s.q}</p><div class="card">${s.fields.map((f, fi) => `<div class="field"><span class="lb">${f.label}</span><div class="seg">${f.opts.map((o, oi) => {
      let cls = st.sel[fi] === oi ? ' on' : '';
      if (st.done) cls = oi === f.a ? ' ok' : st.sel[fi] === oi ? ' no' : '';
      return `<button type="button" class="${cls.trim()}" data-act="fm-pick" data-f="${fi}" data-i="${oi}" aria-pressed="${st.sel[fi] === oi}"${st.done ? ' disabled' : ''}>${o}</button>`;
    }).join('')}</div></div>`).join('')}</div>`;
    return { body, action: st.done ? '<button type="button" class="btn primary" data-act="step-next">다음</button>' : `<button type="button" class="btn primary" data-act="fm-submit"${st.sel.every((x) => x != null) ? '' : ' disabled'}>처방전 제출</button>` };
  }
  /* --- 순서 --- */
  function vOrder(s, k) {
    const st = sst(k, () => ({ seq: [], done: false, pool: shuffle(s.items.map((_, i) => i)) }));
    const left = st.pool.filter((i) => !st.seq.includes(i));
    const body = `<p class="q">${s.q}</p><ol class="olist">${st.seq.map((it, pos) => `<li class="${st.done ? (it === pos ? 'ok' : 'no') : ''}"><button type="button" data-act="od-del" data-i="${it}"${st.done ? ' disabled' : ''} aria-label="${pos + 1}번 ${s.items[it]} 빼기"><span>${pos + 1}</span><span>${s.items[it]}</span></button></li>`).join('')}${!st.done && left.length ? `<li class="slot">${st.seq.length + 1}번에 올 단계를 아래에서 누르세요</li>` : ''}</ol>
      ${st.done ? `<div class="card"><span class="eyebrow">올바른 순서</span>${s.items.map((t, i) => `<div style="font-size:.9rem;font-weight:700">${i + 1}. ${t}</div>`).join('')}</div>` : `<div class="pool">${left.map((i) => `<button type="button" data-act="od-add" data-i="${i}">${s.items[i]}</button>`).join('')}</div>`}`;
    return { body, action: st.done ? '<button type="button" class="btn primary" data-act="step-next">다음</button>' : `<button type="button" class="btn primary" data-act="od-submit"${st.seq.length === s.items.length ? '' : ' disabled'}>순서 확인</button>` };
  }

  /* ================= 화면: 계획서 / 결과 ================= */
  function docHTML() {
    const d = new Date(), date = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
    return `<article class="doc"><div class="dh"><b>노인작업치료 프로그램 계획</b><small>작성일 ${date} · 작성자 ${esc(S.name.trim() || '신입 작업치료사')}</small></div>
      <div class="dr"><span>대상자 정보</span><div>${PLAN.info}</div></div>
      <div class="dr"><span>프로그램 목표</span><div>${PLAN.goal}</div></div>
      <div class="dr"><span>활동 구성 및 과정</span><div><ul>${PLAN.acts.map((a) => `<li>${a}</li>`).join('')}</ul></div></div>
      <div class="dr"><span>평가</span><div>${PLAN.evalTxt}</div></div></article>`;
  }
  function vPlan() {
    if (S.planPhase === 'gen') {
      return { bar: barHome(), body: `<section class="gen" aria-live="polite"><h1 class="h2">계획서를 만들고 있어요…</h1>
        <div class="ln">✅ 대상자 정보 정리</div><div class="ln">✅ 중증도에 맞는 목표 설정</div><div class="ln">✅ 활동 구성과 과정 배치</div><div class="ln">✅ 평가 방법 연결</div></section>` };
    }
    return { bar: barHome(), body: `<section class="stack" style="padding-top:.4rem"><div><span class="eyebrow">완성!</span><h1 class="h2">할머니의 개별 프로그램 계획서</h1><p class="muted">미션에서 고른 정답을 바탕으로 만들어졌어요.</p></div>${docHTML()}</section>`,
      action: '<button type="button" class="btn primary" data-act="to-result">🏆 최종 결과 보기</button>' };
  }
  function vResult() {
    const t = total(), nm = S.name.trim();
    const title = t >= 90 ? '케어핏 마스터 OT' : t >= 75 ? '믿고 맡기는 OT' : t >= 60 ? '성장 중인 신입 OT' : '한 번 더 도전해요';
    const srtOk = S.srt.log.filter((x) => x.ok).length;
    return { bar: barHome(), body: `<section class="stack" style="padding-top:.4rem;text-align:center">
        <span class="eyebrow">${nm ? esc(nm) + ' 선생님의 ' : ''}최종 결과</span>
        <div class="ring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="50"/><circle class="bar" id="ringBar" cx="60" cy="60" r="50" stroke-dasharray="314.2" stroke-dashoffset="314.2"/></svg><b id="countUp">0</b></div>
        <h1 class="h2">${title}</h1>
        <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem"><span class="chip">⏱️ ${fmt(S.time)}</span><span class="chip">🧠 방 번호 회상 ${srtOk}/${S.srt.log.length}</span></div>
      </section>
      <div class="card" style="margin-top:1rem"><span class="eyebrow">미션별 점수</span><div class="bars">${M.map((m, i) => `<div class="br"><span>${i + 1}. ${m.title}</span><em>${mPts(i)}/${m.max}</em><i><u data-w="${Math.round((mPts(i) / m.max) * 100)}"></u></i></div>`).join('')}</div></div>
      <div style="margin-top:1rem">${docHTML()}</div>
      <div class="card task" style="margin-top:1rem"><span class="eyebrow">활동과제</span><p style="font-weight:700">지역사회나 주변에서 노인작업치료 대상을 정하고, 개별 프로그램 계획을 직접 써 보세요.</p>
        <label>대상자 정보<textarea id="tInfo" placeholder="일반적 특성, 작업수행에 영향을 주는 신체적·정신적 기능, 주요 문제"></textarea></label>
        <label>프로그램 목표<textarea id="tGoal" placeholder="프로그램으로 이루고 싶은 목표"></textarea></label>
        <label>프로그램 활동 구성 및 과정<textarea id="tAct" placeholder="주요 활동과 활동 과정"></textarea></label>
        <label>평가<textarea id="tEval" placeholder="효과를 확인할 평가도구"></textarea></label>
        <p class="muted" style="margin-top:.6rem">작성한 내용은 저장되지 않아요. 복사하거나 캡처해서 제출하세요.</p>
        <button type="button" class="btn sec" style="margin-top:.5rem" data-act="copy">📋 내용 복사하기</button></div>
      <p class="muted" style="margin:1rem 0 .4rem;text-align:center">한OO 할머니는 수업용 가상 인물이에요.</p>`,
      action: '<button type="button" class="btn primary" data-act="restart-ask">🔁 처음부터 다시 하기</button>',
      after: () => {
        countTo($('#countUp'), 0, t, 1400);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const b = $('#ringBar'); if (b) b.style.strokeDashoffset = String(314.2 * (1 - t / 100));
          document.querySelectorAll('.bars u').forEach((u) => { u.style.width = u.dataset.w + '%'; });
        }));
      } };
  }

  /* ================= 시트 ================= */
  function renderSheet() {
    const root = $('#sheetRoot'), sh = S.sheet;
    if (!sh) { root.innerHTML = ''; return; }
    if (sh.kind === 'fb') {
      root.innerHTML = `<div class="sheet-back"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="handle"></div>
        <div class="sh-t ${sh.tone}" id="shT">${sh.title}${sh.pts != null ? ` <span class="sh-pts">+${sh.pts}</span>` : ''}</div><div class="sh-b">${sh.body}</div>
        <button type="button" class="btn primary" data-act="${sh.act}" id="shBtn">${sh.btn}</button></div></div>`;
      const b = $('#shBtn'); if (b) b.focus();
    } else if (sh.kind === 'srt') {
      const r = S.srt.res, v = S.srt.input;
      root.innerHTML = `<div class="sheet-back"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="handle"></div>
        <div class="sh-t" id="shT">🔔 기억 미션</div><div class="sh-b">${r ? (r.ok ? '정확해요! 잘 기억하고 계시네요.' : `방 번호는 <b>${S.srt.code}호</b>예요. 다시 한번 외워 두세요!`) : '게임을 시작할 때 외운 한OO 할머니의 방 번호는 몇 호일까요?'}</div>
        <div class="digits">${[0, 1, 2].map((i) => `<span class="${r ? '' : v[i] != null ? '' : i === v.length ? 'empty cur' : 'empty'}">${r ? S.srt.code[i] : v[i] != null ? v[i] : ''}</span>`).join('')}<span class="dash" style="width:auto;font-size:1.1rem">호</span></div>
        ${r ? `<div class="labres ${r.ok ? 'ok' : 'no'}">${r.ok ? '⭕ 성공' : '❌ 다시 외워요'}</div><button type="button" class="btn primary" data-act="srt-close" id="shBtn">확인</button>` : keypad('srt') + '<button type="button" class="btn sec" style="margin-top:.5rem" data-act="srt-forgot">기억이 안 나요</button>'}</div></div>`;
      const b = $('#shBtn'); if (b) b.focus();
    } else if (sh.kind === 'confirm') {
      root.innerHTML = `<div class="sheet-back"><div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div class="sh-t">처음부터 다시 할까요?</div><div class="sh-b">점수와 진행 상황이 모두 사라져요.</div><div class="row2"><button type="button" class="btn sec" data-act="sheet-close" id="shBtn">취소</button><button type="button" class="btn primary" data-act="restart">다시 시작</button></div></div></div>`;
      const b = $('#shBtn'); if (b) b.focus();
    }
  }
  function openFb(ok, pts, body, act, btn) {
    const tone = ok === true ? 'ok' : ok === 'part' ? 'part' : 'no';
    const title = ok === true ? '정답이에요!' : ok === 'part' ? '부분 점수예요' : '아쉬워요';
    S.sheet = { kind: 'fb', tone, title, pts: pts > 0 ? pts : null, body, act: act || 'sheet-close', btn: btn || '확인' };
  }

  /* ================= 렌더링 ================= */
  function render(anim) {
    const V = { splash: vSplash, onboard: vOnboard, home: vHome, mission: vMission, plan: vPlan, result: vResult }[S.screen]();
    const bar = $('#bar'); bar.hidden = !V.bar; bar.innerHTML = V.bar || '';
    const sc = $('#scroll'), y = sc.scrollTop;
    sc.innerHTML = `<div class="page${anim ? ' enter' : ''}">${V.body}</div>`;
    const ac = $('#action'); ac.hidden = !V.action; ac.innerHTML = V.action || '';
    sc.scrollTop = anim ? 0 : y;
    renderSheet();
    if (V.after) V.after();
  }
  function go(screen) { S.screen = screen; S.sheet = null; render(true); }

  /* ================= 진행 ================= */
  function stepNext() {
    S.sheet = null;
    if (S.step < cur().steps.length - 1) { S.step += 1; render(true); return; }
    S.done[S.m] = true; S.phase = 'done';
    SFX.done(); vib([20, 30, 20]);
    if (mPts(S.m) === cur().max) confetti(40);
    pushNote('케어핏', `미션 ${S.m + 1} 완료! ${mPts(S.m)}점을 받았어요.`, '✅');
    render(true);
  }
  function checkSrt(mi) {
    const R = S.srt;
    if (!R.active || R.nextAt !== mi) return;
    R.input = ''; R.res = null; R.lastMi = mi;
    S.sheet = { kind: 'srt' };
    SFX.msg(); vib(20);
    pushNote('케어핏 · 기억 미션', '방 번호, 기억하고 계세요?', '🔔');
    renderSheet();
  }
  function srtAnswer(ok) {
    const R = S.srt;
    R.log.push({ at: S.time - R.learnedAt, ok });
    if (ok) R.gap += 1; else R.learnedAt = S.time;
    R.nextAt = R.lastMi + R.gap;
    R.res = { ok };
    feel(ok);
    renderSheet();
  }

  /* ================= 동작 ================= */
  const A = {
    'to-onboard'() { SFX.tap(); go('onboard'); },
    start() { S.srt.learnedAt = S.time; SFX.tap(); go('home'); pushNote('케어핏', '오늘의 미션 7개가 준비됐어요.', '📋'); },
    sound() { S.sound = !S.sound; render(false); if (S.sound) SFX.tap(); },
    'restart-ask'() { S.sheet = { kind: 'confirm' }; renderSheet(); },
    restart() { S = freshState({ name: S.name, sound: S.sound }); go('splash'); },
    'sheet-close'() { S.sheet = null; renderSheet(); },
    'to-home'() {
      const mi = S.m, wasDone = S.phase === 'done';
      go('home');
      if (wasDone) checkSrt(mi);
    },
    open(el) {
      const i = Number(el.dataset.i);
      if (!(i === 0 || S.done[i - 1])) return;
      if (S.done[i]) { pushNote('케어핏', '이미 완료한 미션이에요.', 'ℹ️'); return; }
      if (S.m !== i) { S.m = i; S.step = 0; }
      S.phase = 'intro';
      if (i === 4) S.srt.active = false;
      SFX.tap(); go('mission');
    },
    'm-start'() { S.phase = 'play'; SFX.tap(); render(true); },
    'step-next'() { stepNext(); },

    'sw-pick'(el) {
      const s = curStep(), k = skey(), st = S.st[k];
      if (!st || st.pick != null) return;
      const c = s.cards[st.order[st.i]], pick = Number(el.dataset.i), ok = pick === c.a;
      st.pick = pick;
      if (ok) addPts(k, s.pts);
      feel(ok);
      openFb(ok, ok ? s.pts : 0, (ok ? '' : `정답은 <b>${s.cats[c.a]}</b>이에요. `) + c.ex, 'sw-next', st.i < s.cards.length - 1 ? '다음 카드' : '다음');
      render(false);
    },
    'sw-next'() {
      const s = curStep(), st = S.st[skey()];
      S.sheet = null;
      if (st.i < s.cards.length - 1) { st.i += 1; st.pick = null; render(false); } else stepNext();
    },

    'mt-l'(el) { const st = S.st[skey()]; if (!st) return; st.sel = Number(el.dataset.i); st.shake = null; SFX.tap(); render(false); },
    'mt-r'(el) {
      const s = curStep(), k = skey(), st = S.st[k];
      if (!st) return;
      if (st.sel == null) { pushNote('케어핏', '왼쪽 항목을 먼저 눌러 주세요.', '👈'); return; }
      const j = Number(el.dataset.i), i = st.sel;
      if (i === j) { st.done[i] = j; if (!st.miss[i]) addPts(k, s.pts); feel(true); st.shake = null; }
      else { st.miss[i] = true; st.shake = { l: i, r: j }; feel(false); }
      st.sel = null;
      render(false);
      if (Object.keys(st.done).length === s.left.length) confetti(16);
    },

    'mcq-pick'(el) {
      const k = el.dataset.k, s0 = curStep(), q = s0.kind === 'cue' ? s0.quiz : s0, st = S.st[k];
      if (!st || st.pick != null) return;
      const oi = Number(el.dataset.i), ok = oi === q.a, stepK = skey(), pts = s0.pts;
      st.pick = oi;
      if (ok) addPts(stepK, pts);
      feel(ok);
      openFb(ok, ok ? pts : 0, (ok ? '' : `정답은 ‘${q.opts[q.a]}’예요. `) + q.ex, 'step-next', '다음');
      render(false);
    },
    'mu-toggle'(el) {
      const st = S.st[skey()]; if (!st || st.done) return;
      const i = Number(el.dataset.i), at = st.sel.indexOf(i);
      if (at >= 0) st.sel.splice(at, 1); else st.sel.push(i);
      SFX.tap(); render(false);
    },
    'mu-submit'() {
      const s = curStep(), k = skey(), st = S.st[k];
      if (!st || st.done || !st.sel.length) return;
      st.done = true;
      const hits = st.sel.filter((x) => s.ok.includes(x)).length, wrong = st.sel.length - hits;
      const p = Math.round((s.pts * Math.max(0, hits - wrong)) / s.ok.length);
      addPts(k, p);
      const tone = p === s.pts ? true : p > 0 ? 'part' : false;
      feel(p === s.pts);
      openFb(tone, p, `골라야 할 선택지는 ${s.ok.length}개였어요. ${s.ex}`, 'sheet-close', '확인');
      render(false);
    },

    'chat-pick'(el) {
      const s = curStep(), k = skey(), st = S.st[k];
      if (!st || st.wait || st.end) return;
      const tn = s.turns[st.t], op = tn.opts[Number(el.dataset.i)];
      st.wait = true;
      st.log.push({ who: 'me', t: op.t });
      if (op.photo) st.log.push({ who: 'ph', p: op.photo });
      SFX.tap();
      if (op.ok) { addPts(k, s.pts); st.goodN += 1; }
      st.mood = clamp(st.mood + op.m, 0, 4);
      st.log.push({ who: 'typing' });
      render(false);
      setTimeout(() => {
        if (S.st[k] !== st) return;
        st.log = st.log.filter((x) => x.who !== 'typing');
        st.log.push({ who: 'g', t: op.r });
        st.log.push({ who: 'fb', ok: op.ok, t: op.fb, ph: tn.ph });
        feel(op.ok);
        st.t += 1;
        if (st.t < s.turns.length) {
          st.log.push({ who: 'typing' });
          render(false);
          setTimeout(() => {
            if (S.st[k] !== st) return;
            st.log = st.log.filter((x) => x.who !== 'typing');
            st.log.push({ who: 'g', t: s.turns[st.t].g });
            st.wait = false; SFX.msg();
            render(false);
          }, reduceMotion ? 0 : 650);
        } else {
          st.end = true; st.wait = false;
          st.log.push({ who: 'sys', t: `세션 종료 · 좋은 대화 ${st.goodN} / ${s.turns.length} · 할머니 기분 ${MOODS[st.mood]}` });
          if (st.goodN === s.turns.length) confetti(36);
          render(false);
        }
      }, reduceMotion ? 0 : 800);
    },

    'cue-learned'() { const st = S.st[skey()]; st.phase = 'run'; st.stage = 0; st.input = ''; st.checked = false; SFX.tap(); render(false); },
    'cue-next'() {
      const s = curStep(), st = S.st[skey()];
      if (st.stage < s.stages.length - 1) { st.stage += 1; st.input = ''; st.checked = false; }
      else st.phase = 'quiz';
      SFX.tap(); render(true);
    },
    kp(el) {
      const c = el.dataset.c, key = el.dataset.k;
      if (c === 'srt3') {
        const r0 = S.st[skey() + '.r']; if (!r0 || r0.done) return;
        if (key === 'del') r0.input = r0.input.slice(0, -1);
        else if (key !== 'ok' && r0.input.length < 3) r0.input += key;
        SFX.tap();
        if (r0.input.length === 3) {
          const ok = r0.input === S.srt.code;
          S.srt.log.push({ at: S.time - S.srt.learnedAt, ok, last: true });
          r0.done = true; feel(ok);
        }
        render(false); return;
      }
      if (c === 'srt') {
        const R = S.srt; if (R.res) return;
        if (key === 'del') R.input = R.input.slice(0, -1);
        else if (key === 'ok') { if (R.input.length === 3) srtAnswer(R.input === R.code); return; }
        else if (R.input.length < 3) R.input += key;
        SFX.tap();
        if (R.input.length === 3) { srtAnswer(R.input === R.code); return; }
        renderSheet(); return;
      }
      const s = curStep(), st = S.st[skey()];
      if (!st || st.checked) return;
      const need = 7 - s.stages[st.stage];
      if (key === 'del') st.input = st.input.slice(0, -1);
      else if (key === 'ok') { if (st.input.length !== need) return; }
      else if (st.input.length < need) st.input += key;
      SFX.tap();
      if (st.input.length === need && (key === 'ok' || key !== 'del')) {
        const ok = st.input === st.num.slice(s.stages[st.stage]);
        st.res.push(ok); st.checked = true; feel(ok);
      }
      render(false);
    },
    'srt-forgot'() { srtAnswer(false); },
    'srt-close'() { S.sheet = null; renderSheet(); },

    'fm-pick'(el) { const st = S.st[skey()]; if (!st || st.done) return; st.sel[Number(el.dataset.f)] = Number(el.dataset.i); SFX.tap(); render(false); },
    'fm-submit'() {
      const s = curStep(), k = skey(), st = S.st[k];
      if (!st || st.done || st.sel.some((x) => x == null)) return;
      st.done = true;
      const n = s.fields.filter((f, i) => st.sel[i] === f.a).length, p = n * s.pts;
      addPts(k, p);
      feel(n === s.fields.length);
      openFb(n === s.fields.length ? true : n > 0 ? 'part' : false, p, `${s.fields.length}개 중 ${n}개를 맞혔어요. ${s.ex}`, 'sheet-close', '확인');
      render(false);
    },

    'od-add'(el) { const st = S.st[skey()]; if (!st || st.done) return; st.seq.push(Number(el.dataset.i)); SFX.tap(); render(false); },
    'od-del'(el) { const st = S.st[skey()]; if (!st || st.done) return; st.seq = st.seq.filter((x) => x !== Number(el.dataset.i)); SFX.tap(); render(false); },
    'od-submit'() {
      const s = curStep(), k = skey(), st = S.st[k];
      if (!st || st.done || st.seq.length !== s.items.length) return;
      st.done = true;
      const right = st.seq.filter((it, pos) => it === pos).length, p = Math.round((s.pts * right) / s.items.length);
      addPts(k, p);
      feel(right === s.items.length);
      openFb(right === s.items.length ? true : p > 0 ? 'part' : false, p, `${s.items.length}단계 중 ${right}단계가 제자리예요. ${s.ex}`, 'sheet-close', '확인');
      render(false);
    },

    'to-plan'() {
      if (!M.every((_, i) => S.done[i])) return;
      S.planPhase = 'gen'; go('plan');
      setTimeout(() => { if (S.screen !== 'plan') return; S.planPhase = 'doc'; SFX.done(); confetti(30); render(true); }, reduceMotion ? 0 : 2100);
    },
    'to-result'() { go('result'); SFX.done(); confetti(50); },
    copy() {
      const v = (id) => ($('#' + id) || {}).value || '';
      const txt = `[활동과제] 노인작업치료 프로그램 계획 / 작성자: ${S.name.trim()}\n대상자 정보: ${v('tInfo')}\n프로그램 목표: ${v('tGoal')}\n프로그램 활동 구성 및 과정: ${v('tAct')}\n평가: ${v('tEval')}`;
      const fallback = () => {
        const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } ta.remove();
        pushNote('케어핏', ok ? '복사했어요. 원하는 곳에 붙여 넣으세요.' : '복사가 막혀 있어요. 화면을 캡처해 주세요.', '📋');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => pushNote('케어핏', '복사했어요. 원하는 곳에 붙여 넣으세요.', '📋')).catch(fallback); else fallback();
    },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', (e) => { const t = e.target; if (t && t.dataset && t.dataset.input === 'name') S.name = t.value.slice(0, 16); });
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName ? e.target.tagName : '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (/^[0-9]$/.test(e.key) || e.key === 'Backspace') {
      const kpBtn = document.querySelector(`.kp [data-k="${e.key === 'Backspace' ? 'del' : e.key}"]`);
      if (kpBtn) { kpBtn.click(); e.preventDefault(); }
    }
    if (e.key === 'Escape' && S.sheet && S.sheet.kind === 'confirm') { S.sheet = null; renderSheet(); }
  });

  let last = performance.now();
  setInterval(() => {
    const now = performance.now(), dt = Math.min(1, (now - last) / 1000); last = now;
    if (['home', 'mission', 'plan'].includes(S.screen)) S.time += dt;
    const sb = $('#sbTime'); if (sb) { const d = new Date(); sb.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
  }, 250);
  render(true);
})();
</script>
</body>
</html>
